name: Docker Build & Publish

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/airline

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: api-gateway
            dockerfile: Backend/Services/ApiGateway/Dockerfile
          - name: identity-api
            dockerfile: Backend/Services/Identity/Identity.API/Dockerfile
          - name: flight-api
            dockerfile: Backend/Services/Flight/Flight.API/Dockerfile
          - name: booking-api
            dockerfile: Backend/Services/Booking/Booking.API/Dockerfile
          - name: payment-api
            dockerfile: Backend/Services/Payment/Payment.API/Dockerfile
          - name: notification-api
            dockerfile: Backend/Services/Notification/Notification.API/Dockerfile
          - name: operations-api
            dockerfile: Backend/Services/Operations/Operations.API/Dockerfile
          - name: inventory-api
            dockerfile: Backend/Services/Inventory/Inventory.API/Dockerfile
          - name: pricing-api
            dockerfile: Backend/Services/Pricing/Pricing.API/Dockerfile
          - name: reward-api
            dockerfile: Backend/Services/Reward/Reward.API/Dockerfile
          - name: dealer-api
            dockerfile: Backend/Services/Dealer/Dealer.API/Dockerfile
          - name: commission-api
            dockerfile: Backend/Services/Commission/Commission.API/Dockerfile
          - name: analytics-api
            dockerfile: Backend/Services/Analytics/Analytics.API/Dockerfile

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push ${{ matrix.service.name }}
      uses: docker/build-push-action@v6
      with:
        context: ./Backend/Services
        file: ${{ matrix.service.dockerfile }}
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
